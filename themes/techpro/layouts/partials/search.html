<div id="search-modal" class="search-modal" role="dialog" aria-modal="true" aria-label="Search site">
    <div class="search-backdrop"></div>
    <div class="search-container fade-in">
        <header class="search-header">
            <svg class="search-input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="search-input" placeholder="Search posts, tags, topics..." aria-label="Search" autocomplete="off" spellcheck="false">
            <button id="close-search" class="icon-btn close-search-btn" aria-label="Close search (Esc)" title="Close (Esc)">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </header>
        <div id="search-results" class="search-results" role="listbox">
            <div class="search-hint">Type keywords to search across all posts and notes...</div>
        </div>
        <footer class="search-footer">
            <span><kbd>ESC</kbd> to close</span>
            <span><kbd>↑</kbd> <kbd>↓</kbd> to navigate</span>
            <span><kbd>↵</kbd> to open</span>
        </footer>
    </div>
</div>

<script type="module">
    import Fuse from 'https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.mjs';

    let fuse = null;
    let searchData = null;
    let selectedIndex = -1;

    const searchBtn = document.getElementById('search-btn');
    const searchModal = document.getElementById('search-modal');
    const closeSearch = document.getElementById('close-search');
    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');
    const backdrop = document.querySelector('.search-backdrop');

    async function initSearch() {
        if (!searchData) {
            try {
                const response = await fetch('{{ site.BaseURL }}index.json');
                searchData = await response.json();
                
                const options = {
                    keys: [
                        { name: 'title', weight: 0.5 },
                        { name: 'tags', weight: 0.3 },
                        { name: 'categories', weight: 0.2 },
                        { name: 'content', weight: 0.1 }
                    ],
                    includeMatches: true,
                    threshold: 0.35,
                    minMatchCharLength: 2,
                    ignoreLocation: true
                };
                fuse = new Fuse(searchData, options);
            } catch (err) {
                console.error('Failed to load search index', err);
            }
        }
    }

    function openSearch() {
        if (!searchModal) return;
        searchModal.classList.add('active');
        searchInput.value = '';
        selectedIndex = -1;
        searchResults.innerHTML = '<div class="search-hint">Type keywords to search across all posts and notes...</div>';
        setTimeout(() => searchInput.focus(), 50);
        initSearch();
        document.body.style.overflow = 'hidden';
    }

    function hideSearch() {
        if (!searchModal) return;
        searchModal.classList.remove('active');
        document.body.style.overflow = '';
        selectedIndex = -1;
    }

    document.querySelectorAll('#search-btn, #mobile-search-btn').forEach(btn => {
        btn.addEventListener('click', openSearch);
    });
    if (closeSearch) closeSearch.addEventListener('click', hideSearch);
    if (backdrop) backdrop.addEventListener('click', hideSearch);

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && searchModal && searchModal.classList.contains('active')) {
            hideSearch();
            return;
        }
        if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
            e.preventDefault();
            if (searchModal && searchModal.classList.contains('active')) {
                hideSearch();
            } else {
                openSearch();
            }
            return;
        }

        if (searchModal && searchModal.classList.contains('active')) {
            const items = searchResults.querySelectorAll('.search-result-item');
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (items.length > 0) {
                    selectedIndex = (selectedIndex + 1) % items.length;
                    updateSelection(items);
                }
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (items.length > 0) {
                    selectedIndex = (selectedIndex - 1 + items.length) % items.length;
                    updateSelection(items);
                }
            } else if (e.key === 'Enter' && selectedIndex >= 0 && items[selectedIndex]) {
                e.preventDefault();
                items[selectedIndex].click();
            }
        }
    });

    function updateSelection(items) {
        items.forEach((item, idx) => {
            if (idx === selectedIndex) {
                item.classList.add('selected');
                item.scrollIntoView({ block: 'nearest' });
            } else {
                item.classList.remove('selected');
            }
        });
    }

    if (searchInput) {
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim();
            selectedIndex = -1;
            if (!query || !fuse) {
                searchResults.innerHTML = '<div class="search-hint">Type keywords to search across all posts and notes...</div>';
                return;
            }

            const results = fuse.search(query).slice(0, 8);
            
            if (results.length === 0) {
                searchResults.innerHTML = '<div class="no-results">No results found for &ldquo;' + escapeHTML(query) + '&rdquo;</div>';
                return;
            }

            searchResults.innerHTML = results.map(({ item }, index) => `
                <a href="${item.permalink}" class="search-result-item" role="option" data-index="${index}">
                    <div class="search-result-header">
                        <span class="search-result-title">${escapeHTML(item.title)}</span>
                        ${item.date ? `<span class="search-result-date">${item.date}</span>` : ''}
                    </div>
                    ${item.summary ? `<div class="search-result-summary">${escapeHTML(item.summary.slice(0, 120))}...</div>` : ''}
                </a>
            `).join('');

            const items = searchResults.querySelectorAll('.search-result-item');
            items.forEach((item, idx) => {
                item.addEventListener('mouseenter', () => {
                    selectedIndex = idx;
                    updateSelection(items);
                });
            });
        });
    }

    function escapeHTML(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }
</script>
