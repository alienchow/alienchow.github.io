{{- $showToc := and (ne .Params.toc false) (ne site.Params.toc false) (gt .WordCount 150) (strings.Contains .Content "<h2") -}}
{{- if $showToc -}}
<!-- Mobile Content Bottom Gradient Fade (gradually fades text above slider area) -->
<div class="toc-mobile-bottom-fade" aria-hidden="true"></div>

<!-- Mobile Backdrop Overlay -->
<div class="toc-mobile-backdrop" id="toc-mobile-backdrop" aria-hidden="true"></div>

<!-- Mobile Mini Pull-Up Tab (Independent fixed element docked permanently at bottom of viewport) -->
<button class="toc-mobile-pull-tab" id="toc-mobile-pull-tab" aria-label="Table of Contents" aria-expanded="false" title="Table of Contents">
    <span class="toc-pull-handle" aria-hidden="true"></span>
    <span class="toc-pull-inner">
        <svg class="toc-title-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="21" y1="10" x2="3" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="21" y1="18" x2="3" y2="18"/></svg>
        <span class="toc-pull-text">Table of Contents</span>
        <span class="toc-pull-chevron-wrap">
            <svg class="toc-pull-chevron" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="18 15 12 9 6 15"/></svg>
        </span>
    </span>
</button>

<div class="toc-accordion" id="toc-accordion" aria-label="Table of contents">
    <!-- Desktop Accordion Header & Toggle -->
    <div class="toc-accordion-header">
        <button class="toc-accordion-toggle" id="toc-accordion-toggle" aria-expanded="true" aria-controls="toc-accordion-body" title="Collapse / Expand Table of Contents">
            <span class="toc-header-left">
                <svg class="toc-title-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="21" y1="10" x2="3" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="21" y1="18" x2="3" y2="18"/></svg>
                <span class="toc-title-text">Table of Contents</span>
            </span>
            <span class="toc-chevron-wrap" aria-hidden="true">
                <svg class="toc-chevron" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </span>
        </button>
    </div>

    <!-- Collapsed Vertical Bookmark Strip (shown when desktop sidebar folds) -->
    <button class="toc-collapsed-strip" id="toc-strip-expand" aria-label="Expand Table of Contents" title="Expand Table of Contents">
        <svg class="strip-icon" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="21" y1="10" x2="3" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="21" y1="18" x2="3" y2="18"/></svg>
        <span class="strip-label">TOC</span>
        <svg class="strip-chevron" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>

    <!-- Accordion Body -->
    <div class="toc-accordion-body" id="toc-accordion-body">
        <div class="toc-content" id="toc-content">
            {{ .TableOfContents }}
        </div>
    </div>
</div>
{{- end -}}
