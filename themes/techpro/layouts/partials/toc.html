{{- $showToc := and (ne .Params.toc false) (ne site.Params.toc false) (gt .WordCount 150) (strings.Contains .Content "<h2") -}}
{{- if $showToc -}}
<aside class="toc-container" aria-label="Table of contents">
    <details class="toc-details" open>
        <summary class="toc-summary">
            <span class="toc-title">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="21" y1="10" x2="3" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="21" y1="18" x2="3" y2="18"/></svg>
                Table of Contents
            </span>
            <span class="toc-chevron" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </span>
        </summary>
        <div class="toc-content">
            {{ .TableOfContents }}
        </div>
    </details>
</aside>
{{- end -}}
