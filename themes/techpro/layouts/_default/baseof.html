<!DOCTYPE html>
<html lang="{{ site.LanguageCode | default "en-us" }}">
<head>
    {{ partial "head.html" . }}
</head>
<body>
    <div id="reading-progress-bar" class="reading-progress-bar" aria-hidden="true"></div>
    {{ partial "header.html" . }}
    <main class="main-content">
        {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
    {{ partial "search.html" . }}
    <button id="back-to-top" class="back-to-top" aria-label="Back to top" title="Back to top">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg>
    </button>
</body>
</html>
